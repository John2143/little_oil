name: build-linux-appimage

# Builds a Linux AppImage (x86_64) on every push to master and on version
# tags (v*). The AppImage is always kept as a workflow artifact; when a v*
# tag is pushed, it is also attached to the GitHub Release of that tag.
#
# Built inside an ubuntu:22.04 container so the AppImage links glibc 2.35:
# runnable on Ubuntu 22.04+, Debian 12+, Fedora 37+, Arch, etc. (not on
# Ubuntu 20.04 / Debian 11). The bundle carries the Wayland/X11 client libs
# that winit dlopens; libGL and glibc are intentionally left to the host.

permissions:
  contents: write

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            curl ca-certificates git build-essential pkg-config file jq gh \
            squashfs-tools desktop-file-utils \
            libudev-dev libfontconfig1-dev libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libwayland-dev libx11-dev libxcb1-dev libxcb-util-dev \
            libxcb-cursor-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-render-util0-dev libxcb-ewmh-dev libxcb-icccm4-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Resolve version
        run: |
          VER="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "little_oil") | .version')"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Download AppImage tooling
        run: |
          curl -fL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage

      - name: Package AppImage
        run: |
          PATH="$PWD:$PATH" ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable target/release/little_oil \
            --desktop-file assets/little_oil.desktop \
            --icon-file assets/little_oil.png \
            --library /usr/lib/x86_64-linux-gnu/libwayland-client.so.0 \
            --library /usr/lib/x86_64-linux-gnu/libwayland-egl.so.1 \
            --library /usr/lib/x86_64-linux-gnu/libxkbcommon.so.0 \
            --library /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so.0 \
            --library /usr/lib/x86_64-linux-gnu/libxcb.so.1 \
            --library /usr/lib/x86_64-linux-gnu/libX11.so.6 \
            --library /usr/lib/x86_64-linux-gnu/libX11-xcb.so.1 \
            --output appimage
          artifact="$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy-*' ! -name 'appimagetool-*')"
          mv "$artifact" "little_oil-${VER}-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: little_oil-appimage
          path: little_oil-*.AppImage
          if-no-files-found: error

      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # jammy's gh (2.17) has no --latest/--clobber; new non-draft releases
          # are Latest by default.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Little Oil $TAG" --generate-notes
          gh release upload "$TAG" "little_oil-${VER}-x86_64.AppImage"
